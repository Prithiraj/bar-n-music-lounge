name: Visual review
on:
  push:
    branches: [design/vibrant-live-room]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Capture site and image availability
        run: |
          mkdir -p review
          python -m http.server 4173 --directory site > /tmp/site-server.log 2>&1 &
          python - <<'PY'
          import json, pathlib, urllib.request
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageOps, ImageDraw
          out = pathlib.Path('review')
          report = {}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000}, reduced_motion='reduce')
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.goto('http://localhost:4173/', wait_until='networkidle', timeout=60000)
              page.locator('footer').scroll_into_view_if_needed()
              page.wait_for_timeout(1500)
              page.evaluate('window.scrollTo(0,0)')
              page.screenshot(path=str(out/'home-desktop.png'), full_page=True)
              report['images'] = page.locator('img').evaluate_all('(imgs) => imgs.map(i => ({src:i.src,ok:i.complete && i.naturalWidth>0,width:i.naturalWidth,height:i.naturalHeight}))')
              report['pageErrors'] = errors
              report['screens'] = []
              for route in ['', 'events/', 'visit/']:
                  for width in [320, 390, 768, 1440]:
                      page.set_viewport_size({'width':width,'height':900})
                      page.goto('http://localhost:4173/'+route,wait_until='networkidle')
                      report['screens'].append({'route':route or 'home','width':width,'overflow':page.evaluate('document.documentElement.scrollWidth > innerWidth'),'h1':page.locator('h1').count()})
                      if width in [390,1440]:
                          page.screenshot(path=str(out/f'{route.strip("/") or "home"}-{width}.png'),full_page=True)
              browser.close()
          tiles=[]
          for i,item in enumerate({x['src']:x for x in report['images']}.values()):
              try:
                  data=urllib.request.urlopen(item['src'],timeout=20).read()
                  f=out/f'photo-{i}.jpg'; f.write_bytes(data)
                  im=Image.open(f).convert('RGB')
                  tile=Image.new('RGB',(400,330),'#eee')
                  tile.paste(ImageOps.contain(im,(400,300)),(0,25))
                  ImageDraw.Draw(tile).text((10,5),str(i)+' '+str(im.size),fill='black')
                  tiles.append(tile)
              except Exception as e: item['error']=str(e)
          if tiles:
              contact=Image.new('RGB',(800,330*((len(tiles)+1)//2)),'#ddd')
              for i,t in enumerate(tiles): contact.paste(t,((i%2)*400,(i//2)*330))
              contact.save(out/'photo-contact.jpg')
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: review/
          retention-days: 7
