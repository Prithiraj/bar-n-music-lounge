name: Visual review
on:
  push:
    branches: [design/vibrant-live-room]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.3
      - name: Build static pages
        run: python scripts/build.py
      - name: Browser, accessibility and visual review
        run: |
          python -m http.server 4173 --directory site > /tmp/site-server.log 2>&1 &
          python scripts/test_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: review/
          retention-days: 7
